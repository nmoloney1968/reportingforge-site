name: FRED smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * *"  # daily 01:20 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python monitor_fred_smoketest.py

      - name: Commit updated monitor page if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor/index.html monitor/fred_last_updated.txt
          git commit -m "Update FRED smoke test"
          git push
