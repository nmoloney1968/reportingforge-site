<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Operator dashboard mock">
  <defs>
    <linearGradient id="rfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D9CDB"/>
      <stop offset="1" stop-color="#6BDCCB"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <style>
      .bg { fill:#0B1220; }
      .shell { fill:#0F1729; stroke:#24304A; stroke-width:2; }
      .card { fill:#111A2E; stroke:#24304A; stroke-width:2; }
      .title { font:800 22px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#EAF2FF; }
      .label { font:600 12px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#A9B7D0; }
      .value { font:800 22px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#EAF2FF; }
      .small { font:600 12px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#A9B7D0; }
      .chipOk { fill:#6BDCCB; fill-opacity:0.18; stroke:#6BDCCB; stroke-width:2; }
      .chipWarn { fill:#2D9CDB; fill-opacity:0.12; stroke:#2D9CDB; stroke-width:2; }
      .accent { stroke:#2D9CDB; }
      .mint { stroke:#6BDCCB; }
      .line { stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .rfText { font:800 14px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#06101D; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="720" rx="28"/>

  <g filter="url(#shadow)">
    <rect class="shell" x="40" y="28" width="1120" height="76" rx="22"/>
  </g>

  <g transform="translate(66,44)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#rfGrad)"/>
    <text x="22" y="28" text-anchor="middle" class="rfText">RF</text>
  </g>

  <text x="126" y="72" class="title">Operator Dashboard (Mock)</text>
  <text x="126" y="96" class="small">Cash, margin, pipeline, service, and what changed</text>

  <g transform="translate(940,52)">
    <rect class="chipOk" x="0" y="0" width="196" height="28" rx="14"/>
    <text x="98" y="19" text-anchor="middle" class="label" fill="#D7FFF6">Refresh OK - 6:00am daily</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="40" y="128" width="268" height="110" rx="22"/>
    <rect class="card" x="326" y="128" width="268" height="110" rx="22"/>
    <rect class="card" x="612" y="128" width="268" height="110" rx="22"/>
    <rect class="card" x="898" y="128" width="262" height="110" rx="22"/>
  </g>

  <text x="64" y="160" class="label">Cash on hand</text>
  <text x="64" y="196" class="value">$128k</text>
  <g transform="translate(220,156)">
    <rect class="chipWarn" x="0" y="0" width="72" height="22" rx="11"/>
    <text x="36" y="15" text-anchor="middle" class="label">30d</text>
  </g>

  <text x="350" y="160" class="label">AR overdue</text>
  <text x="350" y="196" class="value">$22k</text>
  <text x="350" y="218" class="small">Top 5 customers</text>

  <text x="636" y="160" class="label">Pipeline (next 30d)</text>
  <text x="636" y="196" class="value">$310k</text>
  <text x="636" y="218" class="small">Weighted: $180k</text>

  <text x="922" y="160" class="label">Gross margin</text>
  <text x="922" y="196" class="value">42%</text>
  <text x="922" y="218" class="small">Up vs last week</text>

  <g filter="url(#shadow)">
    <rect class="card" x="40" y="260" width="540" height="220" rx="22"/>
    <rect class="card" x="620" y="260" width="540" height="220" rx="22"/>
  </g>

  <text x="64" y="292" class="label">Trend (8 weeks)</text>
  <path class="line mint" d="M70 438c60-86 110-18 160-72c52-56 96-46 150-86c52-38 112-18 180-90" fill="none"/>
  <path class="line accent" d="M70 420c54-52 110-10 160-44c54-38 90-20 150-56c66-40 120-20 180-66" fill="none"/>

  <text x="644" y="292" class="label">What changed this week</text>
  <g transform="translate(644,314)">
    <rect class="chipOk" x="0" y="0" width="210" height="28" rx="14"/>
    <text x="105" y="19" text-anchor="middle" class="label" fill="#D7FFF6">Revenue +12% WoW</text>

    <rect class="chipWarn" x="0" y="40" width="260" height="28" rx="14"/>
    <text x="130" y="59" text-anchor="middle" class="label">Ads spend +18% WoW</text>

    <rect class="chipWarn" x="0" y="80" width="300" height="28" rx="14"/>
    <text x="150" y="99" text-anchor="middle" class="label">Support backlog +9 tickets</text>

    <rect class="chipOk" x="0" y="120" width="280" height="28" rx="14"/>
    <text x="140" y="139" text-anchor="middle" class="label" fill="#D7FFF6">AR collections improved</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="40" y="504" width="1120" height="182" rx="22"/>
  </g>

  <text x="64" y="536" class="label">Next actions (operator list)</text>

  <text x="64" y="566" class="small">Owner</text>
  <text x="230" y="566" class="small">Item</text>
  <text x="780" y="566" class="small">Reason</text>
  <text x="1060" y="566" class="small">Due</text>

  <g class="small">
    <text x="64" y="600">You</text>
    <text x="230" y="600">Call customer: overdue invoice</text>
    <text x="780" y="600">AR 61-90 bucket</text>
    <text x="1060" y="600">Today</text>

    <text x="64" y="628">Sales</text>
    <text x="230" y="628">Review pipeline stuck in stage 2</text>
    <text x="780" y="628">Low conversion</text>
    <text x="1060" y="628">Thu</text>

    <text x="64" y="656">Ops</text>
    <text x="230" y="656">Investigate support backlog spike</text>
    <text x="780" y="656">Tag: billing</text>
    <text x="1060" y="656">Fri</text>
  </g>

  <g stroke="#24304A" stroke-width="2" opacity="0.9">
    <path d="M56 576h1088"/>
    <path d="M56 608h1088"/>
    <path d="M56 636h1088"/>
    <path d="M56 664h1088"/>
  </g>
</svg>
