<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="ReportingForge workflow diagram">
  <defs>
    <linearGradient id="rfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D9CDB"/>
      <stop offset="1" stop-color="#6BDCCB"/>
    </linearGradient>

    <!-- Inkscape-friendly subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <style>
      .bg { fill:#0B1220; }
      .title { font:700 26px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#EAF2FF; }
      .sub { font:500 14px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#A9B7D0; }
      .card { fill:#111A2E; stroke:#24304A; stroke-width:2; }
      .cardTitle { font:700 16px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#EAF2FF; }
      .cardBody { font:500 13px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#A9B7D0; }
      .line { stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .accent { stroke:#2D9CDB; }
      .mint { stroke:#6BDCCB; }
      .badgeText { font:800 14px Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#06101D; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520" rx="28"/>

  <!-- RF badge -->
  <g transform="translate(36,32)" filter="url(#shadow)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#rfGrad)"/>
    <text x="22" y="28" text-anchor="middle" class="badgeText">RF</text>
  </g>

  <text x="100" y="60" class="title">From scattered data to an operator dashboard</text>
  <text x="100" y="88" class="sub">Spreadsheets + SaaS tools (via connectors or simple API pulls) - clean tables - KPI model - dashboard - scheduled refresh</text>

  <!-- Cards -->
  <g filter="url(#shadow)">
    <!-- 1 Sources -->
    <g transform="translate(40,140)">
      <rect class="card" x="0" y="0" width="180" height="220" rx="20"/>
      <text x="16" y="34" class="cardTitle">Sources</text>
      <text x="16" y="60" class="cardBody">Sheets + SaaS apps</text>
      <text x="16" y="80" class="cardBody">QuickBooks, CRM,</text>
      <text x="16" y="100" class="cardBody">Shopify, Tickets, Ads</text>

      <!-- icon: stacked sheets + cloud -->
      <g transform="translate(22,124)">
        <rect x="0" y="20" width="64" height="50" rx="10" fill="#2D9CDB" fill-opacity="0.10" stroke="#2D9CDB" stroke-width="3"/>
        <rect x="10" y="10" width="64" height="50" rx="10" fill="#2D9CDB" fill-opacity="0.10" stroke="#2D9CDB" stroke-width="3"/>
        <path d="M98 46c10-14 30-10 32 6c14 2 18 18 4 25H92c-12 0-18-10-12-18c4-5 10-7 18-7z"
              fill="#6BDCCB" fill-opacity="0.10" stroke="#6BDCCB" stroke-width="3"/>
      </g>
    </g>

    <!-- 2 Extract -->
    <g transform="translate(230,140)">
      <rect class="card" x="0" y="0" width="180" height="220" rx="20"/>
      <text x="16" y="34" class="cardTitle">Extract</text>
      <text x="16" y="60" class="cardBody">Pull raw data</text>
      <text x="16" y="80" class="cardBody">Exports or API</text>

      <!-- icon: arrow down into tray -->
      <g transform="translate(46,132)">
        <path class="line accent" d="M44 0v50" fill="none"/>
        <path class="line accent" d="M26 34l18 18l18-18" fill="none"/>
        <rect x="8" y="56" width="72" height="38" rx="12" fill="#2D9CDB" fill-opacity="0.10" stroke="#2D9CDB" stroke-width="3"/>
        <path class="line mint" d="M18 76h52" fill="none"/>
      </g>
    </g>

    <!-- 3 Clean -->
    <g transform="translate(420,140)">
      <rect class="card" x="0" y="0" width="180" height="220" rx="20"/>
      <text x="16" y="34" class="cardTitle">Clean Tables</text>
      <text x="16" y="60" class="cardBody">Normalize names</text>
      <text x="16" y="80" class="cardBody">Fix types, dates</text>
      <text x="16" y="100" class="cardBody">Remove duplicates</text>

      <!-- icon: broom + table -->
      <g transform="translate(30,128)">
        <rect x="58" y="18" width="78" height="62" rx="14" fill="#6BDCCB" fill-opacity="0.10" stroke="#6BDCCB" stroke-width="3"/>
        <path d="M70 38h54M70 54h54M70 70h54" stroke="#6BDCCB" stroke-width="4" stroke-linecap="round"/>
        <path d="M10 88l34-34" stroke="#2D9CDB" stroke-width="4" stroke-linecap="round"/>
        <path d="M36 48l24 24" stroke="#2D9CDB" stroke-width="6" stroke-linecap="round"/>
        <path d="M18 96c12 8 34 8 48 0c-10-14-38-14-48 0z" fill="#2D9CDB" fill-opacity="0.25" stroke="#2D9CDB" stroke-width="3"/>
      </g>
    </g>

    <!-- 4 KPI Model -->
    <g transform="translate(610,140)">
      <rect class="card" x="0" y="0" width="180" height="220" rx="20"/>
      <text x="16" y="34" class="cardTitle">KPI Model</text>
      <text x="16" y="60" class="cardBody">Definitions once</text>
      <text x="16" y="80" class="cardBody">Measures you trust</text>

      <!-- icon: gears -->
      <g transform="translate(40,132)">
        <circle cx="44" cy="52" r="22" fill="#2D9CDB" fill-opacity="0.12" stroke="#2D9CDB" stroke-width="3"/>
        <path class="line accent" d="M44 22v8M44 74v8M14 52h8M66 52h8M24 32l6 6M58 66l6 6M24 72l6-6M58 38l6-6" fill="none"/>
        <circle cx="44" cy="52" r="8" fill="#0B1220" stroke="#6BDCCB" stroke-width="3"/>
        <circle cx="86" cy="74" r="14" fill="#6BDCCB" fill-opacity="0.12" stroke="#6BDCCB" stroke-width="3"/>
      </g>
    </g>

    <!-- 5 Dashboard -->
    <g transform="translate(800,140)">
      <rect class="card" x="0" y="0" width="180" height="220" rx="20"/>
      <text x="16" y="34" class="cardTitle">Dashboard</text>
      <text x="16" y="60" class="cardBody">Operator questions</text>
      <text x="16" y="80" class="cardBody">Clear weekly rhythm</text>

      <!-- icon: mini dashboard -->
      <g transform="translate(22,122)">
        <rect x="0" y="10" width="136" height="92" rx="16" fill="#2D9CDB" fill-opacity="0.10" stroke="#2D9CDB" stroke-width="3"/>
        <rect x="14" y="24" width="34" height="18" rx="8" fill="#6BDCCB" fill-opacity="0.18" stroke="#6BDCCB" stroke-width="2"/>
        <rect x="56" y="24" width="34" height="18" rx="8" fill="#6BDCCB" fill-opacity="0.10" stroke="#6BDCCB" stroke-width="2"/>
        <rect x="98" y="24" width="24" height="18" rx="8" fill="#6BDCCB" fill-opacity="0.06" stroke="#6BDCCB" stroke-width="2"/>
        <path class="line mint" d="M18 78c16-20 28-6 40-18c14-14 24-10 38-22c8-8 18-4 30-14" fill="none"/>
      </g>
    </g>

    <!-- 6 Refresh -->
    <g transform="translate(990,140)">
      <rect class="card" x="0" y="0" width="170" height="220" rx="20"/>
      <text x="16" y="34" class="cardTitle">Refresh</text>
      <text x="16" y="60" class="cardBody">Scheduled</text>
      <text x="16" y="80" class="cardBody">Sanity checks</text>

      <!-- icon: refresh arrows + clock -->
      <g transform="translate(36,128)">
        <path class="line accent" d="M24 38a28 28 0 1 1 10 44" fill="none"/>
        <path class="line accent" d="M18 38h18v-18" fill="none"/>
        <circle cx="82" cy="70" r="20" fill="#6BDCCB" fill-opacity="0.12" stroke="#6BDCCB" stroke-width="3"/>
        <path class="line mint" d="M82 70V58M82 70l10 8" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Connecting arrows -->
  <g class="line" fill="none" stroke="#2D9CDB" opacity="0.95">
    <path d="M220 250h28"/>
    <path d="M410 250h28"/>
    <path d="M600 250h28"/>
    <path d="M790 250h28"/>
    <path d="M980 250h28"/>
  </g>
  <g fill="#2D9CDB" opacity="0.95">
    <path d="M246 250l-10-7v14z"/>
    <path d="M436 250l-10-7v14z"/>
    <path d="M626 250l-10-7v14z"/>
    <path d="M816 250l-10-7v14z"/>
    <path d="M1006 250l-10-7v14z"/>
  </g>

  <text x="40" y="470" class="sub">Tip: Start with one source, prove refresh, then add complexity. The goal is control and clarity, not perfection.</text>
</svg>
