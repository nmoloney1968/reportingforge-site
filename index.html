  <title>Reporting Forge – AI first automation for Python, APIs, and Power BI</title>

  <style>
    :root {
      --bg: #020617;
      --bg-card: rgba(15,23,42,0.97);
      --border-subtle: #1e293b;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-soft: rgba(56,189,248,0.1);
      --good: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #0f172a 0, #020617 50%, #000000 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .shell {
      max-width: 1080px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 3.4rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2.6rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .brand-logo {
      height: 40px;
      width: auto;
      display: block;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text);
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      font-size: 0.9rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
    }

    nav a.active {
      color: var(--text);
      font-weight: 500;
    }

    .nav-cta {
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(56,189,248,0.6);
      background: radial-gradient(circle at top left, rgba(56,189,248,0.18), rgba(15,23,42,0.95));
      font-size: 0.82rem;
      font-weight: 500;
    }

    .nav-cta:hover {
      text-decoration: none;
      border-color: rgba(56,189,248,0.9);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 1.9rem;
      align-items: stretch;
    }

    .hero {
      border-radius: 24px;
      border: 1px solid rgba(148,163,184,0.7);
      background: var(--bg-card);
      box-shadow: 0 22px 50px rgba(15,23,42,0.95);
      padding: 2.1rem 1.9rem 2.2rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.32rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      background: rgba(15,23,42,0.98);
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .pill-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--good);
      box-shadow: 0 0 0 4px rgba(34,197,94,0.25);
    }
