workers_dev = false
preview_urls = false

routes = [
  { pattern = "reportingforge.com/worldcup2026schedule/results.json*", zone_name = "reportingforge.com" }
]
name = "worldcup-results-worker"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Run every minute during active match windows. After group-stage polling has ended
# and final results are verified, remove the [triggers] crons entry below and redeploy
# to stop scheduled invocations completely.
[triggers]
crons = ["*/3 * * * *"]

[[kv_namespaces]]
binding = "RESULTS"
id = "14663b6609624f9e82ecb1871c570452"

# Optional: deploy the route with Wrangler after KV + secrets are configured.
# Otherwise configure the same route in the Cloudflare dashboard.
# [[routes]]
# pattern = "reportingforge.com/worldcup2026schedule/results.json*"
# zone_name = "reportingforge.com"
